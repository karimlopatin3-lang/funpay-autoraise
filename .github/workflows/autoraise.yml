name: FunPay AutoRaise

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  autoraise:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download FunPayAPI
        run: |
          git clone --depth 1 https://github.com/MorikTV/FunPayAPI.git
          pip install requests beautifulsoup4 lxml requests-toolbelt

      - name: Get Telegram Chat ID
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_TOKEN"]

          data = requests.get(
              f"https://api.telegram.org/bot{token}/getUpdates",
              timeout=15
          ).json()

          for update in data.get("result", []):
              message = update.get("message", {})
              chat = message.get("chat", {})

              if chat.get("id"):
                  print(f"CHAT_ID={chat['id']}")
          PY

      - name: Run AutoRaise
        env:
          FUNPAY_GOLDEN_KEY: ${{ secrets.FUNPAY_GOLDEN_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          python main.py

